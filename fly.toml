app = "hotel-minibar"
primary_region = "fra"
kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  NODE_ENV = "production"
  CORS_ORIGIN = "auto"
  JWT_EXPIRES_IN = "24h"
